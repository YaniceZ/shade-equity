[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shade-equity"
version = "0.1.0"
description = "Can open global data measure pedestrian shade for older adults? A LiDAR benchmark and route-based shade access in Vancouver."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Yanice Zeng" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "scipy>=1.11",
    "numba>=0.59",
    "osmnx>=2.0",
    "networkx>=3.2",
    "duckdb>=1.1",
    "pyarrow>=15",
    "requests>=2.31",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
data = ["pyrosm>=0.29", "planetary-computer>=1.0", "pystac-client>=0.8"]

[project.scripts]
shadeq = "shadeq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 170
target-version = "py310"
extend-exclude = ["data", "scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
